name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # pyproject.toml pins tool.uv.required-environments to win32, so the
    # lockfile is only guaranteed resolvable on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies (core + test extra)
        run: uv sync --extra test

      - name: Run test suite
        run: uv run pytest -v

  latest-deps:
    # Installs BaseAL the way another project would (pip, no lockfile), so the
    # newest releases allowed by the lower-bound pins are tested, including
    # NumPy 2. "test" alone is the core install other packages pull in.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        extras: ["test", "test,api"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BaseAL with the latest dependencies
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Run test suite
        run: python -m pytest -v

  conda:
    # Checks the conda route in environment.yml (issue #7), which resolves
    # independently of uv.lock.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Create conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: baseal
          miniforge-version: latest

      # --no-deps keeps pip from replacing the conda-forge builds.
      - name: Install BaseAL
        run: pip install --no-deps -e .

      - name: Run test suite
        run: python -m pytest -v
