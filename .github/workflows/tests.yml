name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # pyproject.toml pins tool.uv.required-environments to win32, so the
    # lockfile is only guaranteed resolvable on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies (core + test extra)
        run: uv sync --extra test

      - name: Run test suite
        run: uv run pytest -v
