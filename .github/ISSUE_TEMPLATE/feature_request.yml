name: Feature request
description: Suggest a new feature, sampling strategy or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Include references (for example a paper) if you are proposing a new sampling strategy.
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this (see CONTRIBUTING.md)
