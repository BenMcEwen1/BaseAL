name: Bug report
description: Something in BaseAL doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran (code, notebook cell or command), what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or traceback
      description: Paste the full output. It will be formatted as code automatically.
      render: text
  - type: input
    id: version
    attributes:
      label: BaseAL version or commit
      placeholder: e.g. 1.2.1, or a commit hash
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install BaseAL?
      options:
        - uv sync
        - conda (environment.yml)
        - Docker or Apptainer image
        - Other (describe above)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: e.g. Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Dataset used, and for web app problems your Node.js version and any browser console errors.
